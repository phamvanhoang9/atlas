# docker-compose.yml (Development Version)
# For production use docker-compose.prod.yml.

services:
  atlas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-dev

    # All API keys and settings come from .env (copy .env.example -> .env)
    env_file:
      - .env

    environment:
      - PYTHONUNBUFFERED=1
      - HISTORY_DB_PATH=/app/.atlas_data/history.sqlite
      - ATLAS_CACHE_DB=/app/.atlas_cache/cache.sqlite

    # Expose on all interfaces for easy LAN access during development
    ports:
      - "8000:8000"

    # Persist generated reports, history DB, and caches across restarts
    volumes:
      - ./outputs:/app/outputs
      - ./.atlas_data:/app/.atlas_data
      - ./.atlas_cache:/app/.atlas_cache

    networks:
      - atlas-network

    restart: on-failure

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"

networks:
  atlas-network:
    driver: bridge
