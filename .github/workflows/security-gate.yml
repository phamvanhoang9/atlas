name: Security Gate

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  ATLAS_SECURITY_STRICT: "1"
  GITLEAKS_VERSION: "8.21.2"

jobs:
  security-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install app + security dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-security.txt

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run AI/app/dependency security gate
        id: gate
        run: python scripts/security/security_gate.py --stage push

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-reports/
          retention-days: 30

      - name: Infrastructure scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,secrets,github_actions
          output_format: cli
          quiet: true
          soft_fail: false

  deployment-gate:
    needs: security-review
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Gate satisfied
        run: echo "Security gate passed; main is eligible for deployment."
