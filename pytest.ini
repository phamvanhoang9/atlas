[pytest]
testpaths = tests
norecursedirs =
    .venv
    __pycache__
    .pytest_cache
    learning
    scratch
    outputs
    docs
addopts = -p no:cacheprovider
filterwarnings =
    ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14 or greater:UserWarning
    ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3.17:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
    ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning
