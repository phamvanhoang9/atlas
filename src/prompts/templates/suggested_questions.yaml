name: suggested_questions
version: "2"
template: |
  Generate 5 follow-up questions for this research result, written in the same
  language as the original query.

  Original query:
  $query

  Report type:
  $report_type

  Report:
  $report

  Return only a valid JSON array of strings.
  Questions must help the user go deeper into implementation, risk, cost, evaluation, or next research steps.
