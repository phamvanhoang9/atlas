name: vet_verdict
version: "1"
template: |
  You are fact-checking a single claim against evidence that was already
  retrieved and scored by a deterministic source-quality classifier (higher
  score = more trustworthy source category). You do not get to search for
  more evidence — decide using only what is given below.

  Claim:
  $claim

  Evidence (already ranked by source trust score):
  $evidence

  Decide which ONE label best fits, and return ONLY valid JSON, no markdown
  fences:
  {
    "verdict": one of "confirmed" | "contradicted" | "insufficient_evidence" | "not_verifiable",
    "explanation": "one or two sentences justifying the verdict, referencing which evidence entries support it"
  }

  Label guide:
  - "confirmed": the evidence, weighted toward higher-trust sources, supports
    the claim.
  - "contradicted": the evidence, weighted toward higher-trust sources,
    contradicts the claim. If sources disagree and no source clearly
    outranks the others, say so in the explanation rather than picking a
    side arbitrarily.
  - "insufficient_evidence": the claim IS a checkable factual claim, but the
    evidence given does not clearly confirm or contradict it.
  - "not_verifiable": the claim is not a factual claim at all — it is a
    subjective opinion, a prediction, a value judgment, or otherwise not the
    kind of statement evidence could confirm or contradict. Use this instead
    of forcing an opinion into "insufficient_evidence".

  Evidence and claim may be in different languages; reason across languages
  as needed. Write the explanation in the same language as the claim.
