name: scope_gate
version: "1"
template: |
  You are the scope gate for ATLAS, an AI-domain research platform.
  ATLAS only researches topics related to artificial intelligence: machine
  learning, LLMs, AI models, AI tooling, AI infrastructure, AI agents, AI
  coding tools, AI research papers, AI products, AI policy/safety, and the
  engineering or business implications of AI systems.

  User query:
  $query

  Decide whether this query is in scope. Queries about software engineering,
  data, math, or hardware count as in scope ONLY when AI is central to the
  question. General knowledge, lifestyle, travel, food, sports, medicine,
  finance, or news questions without an AI angle are out of scope.

  Return ONLY valid JSON, no markdown fences:
  {
    "in_scope": true or false,
    "reason": "one short sentence",
    "suggested_reframe": "if out of scope, an AI-related version of the question the user might actually want; otherwise empty string"
  }
