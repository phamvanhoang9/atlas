name: query_generation
version: "2"
template: |
  Generate exactly $max_iterations web search queries for:
  "$question"

  Current year: $current_year.

  Return only a valid JSON array with exactly $max_iterations item(s).
  Required format: $format_example

  Search policy for this research mode:
  $search_policy
  $plan_block

  Rules:
  - Queries must be in English, even if the user query is in another language.
  - Prefer recent material from $current_year and $previous_year when recency matters.
  - Each query must target a distinct aspect of the question — no near-duplicates.
  - Do not return marketing pages, videos, or tutorial-only queries.

  Good example:
  $good_example
