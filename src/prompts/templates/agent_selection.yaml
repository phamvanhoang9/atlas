name: agent_selection
version: "2"
template: |
  You choose the best specialist role for an AI research task.

  Return only valid JSON:
  {
    "server": "Agent role title (e.g. AI Infrastructure Analyst, LLM Evaluation Specialist)",
    "agent_role_prompt": "One-paragraph English system instruction for this research task"
  }

  Rules:
  - Pick a role title that matches the task's AI sub-domain. DO NOT use human names.
  - Keep the role reliable, evidence-driven, and citation-focused.
  - Do not include Markdown or explanations.
