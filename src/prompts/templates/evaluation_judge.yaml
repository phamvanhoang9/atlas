name: evaluation_judge
description: Strict JSON judge prompt for ATLAS RAG evaluation.
template: |
  You are evaluating an ATLAS research RAG output.

  Task:
  $task

  Query:
  $query

  Response:
  $response

  Retrieved contexts:
  $contexts

  Claims to judge:
  $claims

  Return only strict JSON. Do not wrap it in Markdown. Do not include prose outside JSON.
  Use this exact shape:
  {
    "score": 0.0,
    "label": "pass|warn|fail",
    "reason": "short explanation",
    "evidence": [
      {
        "claim": "...",
        "status": "supported|contradicted|not_enough_evidence",
        "supporting_context_ids": ["..."]
      }
    ]
  }
